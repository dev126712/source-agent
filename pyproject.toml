[project]
name = "sourcing-agent"
version = "0.1.0"
description = "AI agent that finds local products worth selling on Amazon"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "langchain-anthropic>=0.2.4",
    "langchain-openai>=0.2.5",
    "langchain-groq>=0.2.1",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "charset-normalizer>=3.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
